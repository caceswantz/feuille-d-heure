<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feuille d’heures</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#6b7385;--ln:#e2e5ec;--ac:#2f6fed;--ac2:#e8f0ff;--off:#eceef2;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d222b;--tx:#e8ebf2;--mut:#98a1b3;--ln:#2d3440;--ac:#6c9bff;--ac2:#22304d;--off:#262c36;--bad:#ff7b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:12px}
.wrap{max-width:720px;margin:auto}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:1.25rem;margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:9px 11px}
input[type=text]{flex:1;min-width:130px}
input[type=number]{width:90px}
input[type=time]{width:106px;padding:6px 8px}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.wk{display:flex;justify-content:space-between;font-weight:600;background:var(--ac2);padding:8px 12px;border-radius:10px;margin:14px 0 6px}
.day{padding:8px 4px;border-bottom:1px solid var(--ln)}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.nm{flex:1}
.nm small,.day>small{color:var(--mut);display:block}
.day.off{background:var(--off)}
.tm{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:6px;color:var(--mut)}
.tm i{font-style:normal;margin:0 6px}
.ctl{display:flex;align-items:center;gap:6px}
.ctl button{width:40px;height:40px;padding:0;font-size:1.25rem;line-height:1}
.val{min-width:52px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.abs{font-size:.8rem;padding:6px 8px;color:var(--mut)}
.tot{display:flex;justify-content:space-between;font-size:1.15rem;font-weight:700;padding:6px 0}
.sub{color:var(--mut);font-size:.9rem}
.neg{color:var(--bad)}
canvas{width:100%;height:150px;border:1px dashed var(--mut);border-radius:10px;background:#fff;touch-action:none;display:block}
.pr{display:none}
@media print{
 body{background:#fff;color:#000;padding:0;font-size:12px}
 .card{border:0;padding:0;margin-bottom:6px}
 .noprint,.ctl button,.abs{display:none!important}
 .pr{display:block}
 input,select{border:0;background:none;padding:0;color:#000;appearance:none;-webkit-appearance:none}
 input[type=time]{width:auto}
 input::-webkit-calendar-picker-indicator{display:none}
 .day{padding:2px 0}.tm{margin-top:0}.wk{background:#eee;margin:6px 0 2px;padding:3px 8px}
 .day.off{background:#f3f3f3}
 canvas{border:1px solid #999;height:90px}
 @page{size:A4;margin:10mm}
}
.pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;padding:8px;background:var(--ac2);border-radius:10px}
.pick small{width:100%;color:var(--mut)}
.pick button{font-size:.85rem;padding:7px 9px}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px}
.chk input{width:20px;height:20px;padding:0}
@media print{body.nosup .supl,body.nosup .supx{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
 <div class="card">
  <h1>Feuille d’heures — <span id="ttl"></span></h1>
  <div class="row" style="margin-bottom:8px">
   <input type="text" id="name" placeholder="Nom et prénom">
   <input type="text" id="emp" placeholder="Entreprise">
  </div>
  <div class="row noprint">
   <button id="prev">‹</button>
   <select id="mois"></select>
   <input type="number" id="an" min="2000" max="2100">
   <button id="next">›</button>
  </div>
 </div>

 <div class="card">
  <div id="weeks"></div>
  <div class="row noprint" style="margin-top:12px">
   <button id="addw">＋ Ajouter une semaine</button>
   <button id="delw">－ Retirer une semaine</button>
  </div>
 </div>

 <div class="card">
  <div class="tot"><span>Total du mois</span><span id="tot"></span></div>
  <div class="sub" id="det"></div>
  <div class="tot supl" style="font-size:1rem;margin-top:6px"><span>Heures supplémentaires (au-delà de 35 h/semaine)</span><span id="sup"></span></div>
  <label class="chk noprint"><input type="checkbox" id="supc"> Noter les heures supplémentaires dans le PDF</label>
 </div>

 <div class="card">
  <div class="row" style="justify-content:space-between;margin-bottom:6px"><strong>Signature</strong>
   <button class="noprint" id="clr">Effacer</button></div>
  <canvas id="sig"></canvas>
  <div class="pr sub" style="margin-top:6px">Fait le <span id="today"></span></div>
 </div>

  <div class="card noprint">
  <strong>Données</strong>
  <div class="row" style="margin-top:8px">
   <button id="reset">Remettre ce mois à zéro</button>
   <button id="exp">Sauvegarder (fichier)</button>
   <button id="imp">Restaurer</button>
   <input type="file" id="file" accept=".json,application/json" hidden>
  </div>
  <div class="sub" style="margin-top:6px">Chaque mois est conservé dans ce navigateur : naviguez avec ‹ et › pour retrouver les mois précédents.</div>
 </div>

 <div class="row noprint"><button class="p" id="pdf" style="flex:1">Exporter en PDF</button></div>
 <p class="sub noprint">Astuce : dans la fenêtre d’impression, choisissez « Enregistrer au format PDF ».</p>
</div>

<script>
const MOIS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const JRS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const $=s=>document.querySelector(s);
const KEY='feuille-heures-v2';
const DEF_T=['08:00','11:30','13:00','17:30'];
let S={over:{},extra:{},name:'',emp:'Wantz',sigs:{},sup:false};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const now=new Date();
S.y=now.getFullYear();S.m=now.getMonth();if(!S.sigs)S.sigs={};
if(S.sig){const k0=S.y+'-'+S.m;if(!S.sigs[k0])S.sigs[k0]=S.sig;delete S.sig}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const [Y,M,D]=k.split('-').map(Number);return new Date(Y,M-1,D)};
const fmt=h=>String(Math.round(h*100)/100).replace('.',',')+' h';
const clone=o=>JSON.parse(JSON.stringify(o));
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const fromMin=n=>pad(Math.floor(n/60))+':'+pad(n%60);

function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=(h+l-7*m+114)%31+1;return new Date(y,mo-1,da)}
const HC={};
function hol(y){if(HC[y])return HC[y];const o={};
 const E=easter(y),pl=n=>new Date(E.getFullYear(),E.getMonth(),E.getDate()+n),add=(d,n)=>o[iso(d)]=n;
 [[0,1,'Jour de l’an'],[4,1,'Fête du travail'],[4,8,'Victoire 1945'],[6,14,'Fête nationale'],[7,15,'Assomption'],[10,1,'Toussaint'],[10,11,'Armistice'],[11,25,'Noël']].forEach(([m,d,n])=>add(new Date(y,m,d),n));
 add(pl(1),'Lundi de Pâques');add(pl(39),'Ascension');add(pl(50),'Lundi de Pentecôte');return HC[y]=o}
const holName=d=>hol(d.getFullYear())[iso(d)];

// Journée par défaut : {t:[début1,fin1,début2,fin2]} ou {h:nombre} pour un jour férié
function def(d){
 const wd=d.getDay();
 if(holName(d))return {h:wd===6?0:7};
 if(wd===6)return {t:['','','','']};
 return {t:DEF_T.slice()}}
function hrs(o){
 if(o.h!==undefined)return o.h;
 let s=0;for(let p=0;p<2;p++){const a=o.t[2*p],b=o.t[2*p+1];if(a&&b&&toMin(b)>toMin(a))s+=(toMin(b)-toMin(a))/60}
 return Math.round(s*100)/100}
const get=(k,d)=>S.over[k]||def(d);

function build(){
 const y=S.y,m=S.m,last=new Date(y,m+1,0);
 const f=new Date(y,m,1);
 const sat=new Date(y,m,1+((6-f.getDay()+7)%7)); // premier samedi du mois
 let mon=new Date(sat.getFullYear(),sat.getMonth(),sat.getDate()-5);
 const weeks=[];
 while(new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+5)<=last){weeks.push(new Date(mon));mon.setDate(mon.getDate()+7)}
 const base=weeks.length,ex=S.extra[y+'-'+m]||0;
 for(let i=0;i<ex;i++){weeks.push(new Date(mon));mon.setDate(mon.getDate()+7)}
 return {weeks,base}
}

let pk=null;
const NM=[['Début matin','Fin matin'],['Reprise','Fin de journée']];
function opts(o,dir){
 const t=o.t,out=[];
 for(let p=0;p<2;p++){
  const a=t[2*p],b=t[2*p+1];
  if(!(a&&b)){
   if(dir>0){const s=p?'13:00':'08:00',e=p?'13:30':'08:30';out.push({txt:`Ajouter ${p?'l’après-midi':'le matin'} ${s}–${e}`,ok:true,fn:()=>{t[2*p]=s;t[2*p+1]=e}})}
   continue}
  const sm=toMin(a),em=toMin(b);
  if(dir<0&&em-sm<=30){out.push({txt:`Supprimer ${p?'l’après-midi':'le matin'} (${a}–${b})`,ok:true,fn:()=>{t[2*p]='';t[2*p+1]=''}});continue}
  const ns=sm-30*dir,ne=em+30*dir;
  const p1=t[0]&&t[1],p2=t[2]&&t[3];
  const okS=ns>=0&&ns<em&&(p!==1||!p1||ns>=toMin(t[1]));
  const okE=ne<=1439&&ne>sm&&(p!==0||!p2||ne<=toMin(t[2]));
  out.push({txt:`${NM[p][0]} ${a} → ${fromMin(Math.max(0,ns))}`,ok:okS,fn:()=>{t[2*p]=fromMin(ns)}});
  out.push({txt:`${NM[p][1]} ${b} → ${fromMin(Math.min(1439,ne))}`,ok:okE,fn:()=>{t[2*p+1]=fromMin(ne)}});
 }
 return out}

function render(){
 const y=S.y,m=S.m,{weeks,base}=build();
 document.body.classList.toggle('nosup',!S.sup);$('#supc').checked=!!S.sup;
 $('#ttl').textContent=MOIS[m]+' '+y;$('#mois').value=m;$('#an').value=y;
 $('#name').value=S.name;$('#emp').value=S.emp;
 const sk=S.y+'-'+S.m;if(sk!==lastSK){lastSK=sk;drawSig()}
 let html='',total=0,days=0,sup=0;
 weeks.forEach((mon,wi)=>{
  let wt=0,rows='';
  for(let i=0;i<6;i++){
   const d=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i),k=iso(d);
   const h=holName(d),o=get(k,d),v=hrs(o),inM=d.getMonth()===m;
   wt+=v;if(v>0)days++;
   const sub=(inM?'':MOIS[d.getMonth()].toLowerCase())+(h?(inM?'':' · ')+'Férié : '+h:'');
   let tm='',pick='';
   if(o.t){tm=`<div class="tm"><input type="time" data-k="${k}" data-i="0" value="${o.t[0]}"><span>–</span><input type="time" data-k="${k}" data-i="1" value="${o.t[1]}"><i>·</i><input type="time" data-k="${k}" data-i="2" value="${o.t[2]}"><span>–</span><input type="time" data-k="${k}" data-i="3" value="${o.t[3]}"></div>`;
    if(pk&&pk.k===k){const os=opts(clone(o),pk.dir);
     pick=`<div class="pick noprint"><small>${pk.dir>0?'Ajouter 30 min à quel moment ?':'Retirer 30 min à quel moment ?'}</small>`+os.map((x,j)=>`<button data-k="${k}" data-o="${j}" ${x.ok?'':'disabled'}>${x.txt}</button>`).join('')+`<button data-close="1">✕</button></div>`}}
   rows+=`<div class="day ${h?'off':''}"><div class="top"><div class="nm">${JRS[i]} ${d.getDate()}${sub?`<small>${sub}</small>`:''}</div>
   <div class="ctl"><button data-k="${k}" data-d="-1">−</button><span class="val">${fmt(v)}</span><button data-k="${k}" data-d="1">+</button></div>
   <button class="abs" data-k="${k}" data-abs="1">Absent</button></div>${tm}${pick}</div>`}
  total+=wt;const ws=Math.max(0,Math.round((wt-35)*100)/100);sup+=ws;
  html+=`<div class="wk"><span>Semaine ${wi+1}${wi>=base?' (ajoutée)':''} · ${mon.getDate()} ${MOIS[mon.getMonth()].slice(0,3).toLowerCase()}.</span><span>${fmt(wt)}${ws>0?`<span class="supx"> · dont ${fmt(ws)} sup.</span>`:''}</span></div>${rows}`;
 });
 $('#weeks').innerHTML=html;
 $('#tot').textContent=fmt(total);
 $('#det').textContent=`${days} jour${days>1?'s':''} travaillé${days>1?'s':''} · contrat de 35 h par semaine`;
 $('#sup').textContent=fmt(sup);
 $('#delw').disabled=!(S.extra[y+'-'+m]>0);
}

$('#weeks').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.close){pk=null;return render()}
 const k=b.dataset.k,cur=clone(get(k,parse(k)));
 if(b.dataset.o!==undefined){opts(cur,pk.dir)[+b.dataset.o].fn();S.over[k]=cur;pk=null;save();return render()}
 if(b.dataset.abs){
  pk=null;
  if(hrs(cur)>0)S.over[k]=cur.h!==undefined?{h:0}:{t:['','','','']};
  else delete S.over[k];
 }else if(cur.h!==undefined){cur.h=Math.min(24,Math.max(0,cur.h+(+b.dataset.d)*.5));S.over[k]=cur}
 else{const dir=+b.dataset.d;pk=(pk&&pk.k===k&&pk.dir===dir)?null:{k,dir};return render()}
 save();render();
});
$('#weeks').addEventListener('change',e=>{
 const i=e.target.dataset.i;if(i===undefined)return;
 const k=e.target.dataset.k,cur=clone(get(k,parse(k)));
 if(!cur.t)return;cur.t[+i]=e.target.value;S.over[k]=cur;pk=null;save();render();
});
$('#supc').onchange=e=>{S.sup=e.target.checked;save();render()};

MOIS.forEach((n,i)=>$('#mois').add(new Option(n,i)));
const go=dm=>{const t=S.y*12+S.m+dm;S.y=Math.floor(t/12);S.m=t%12;save();render()};
$('#prev').onclick=()=>go(-1);$('#next').onclick=()=>go(1);
$('#mois').onchange=e=>{S.m=+e.target.value;save();render()};
$('#an').onchange=e=>{const v=+e.target.value;if(v>1999&&v<2101){S.y=v;save();render()}};
$('#addw').onclick=()=>{const k=S.y+'-'+S.m;S.extra[k]=(S.extra[k]||0)+1;save();render()};
$('#delw').onclick=()=>{const k=S.y+'-'+S.m;if(S.extra[k]>0){S.extra[k]--;save();render()}};
$('#name').oninput=e=>{S.name=e.target.value;save()};
$('#emp').oninput=e=>{S.emp=e.target.value;save()};
const setToday=()=>{$('#today').textContent=new Date().toLocaleDateString('fr-FR')};
$('#pdf').onclick=()=>{setToday();window.print()};
window.addEventListener('beforeprint',setToday);

// Signature (une par mois)
let lastSK=null;
const cv=$('#sig'),ctx=cv.getContext('2d');let drawing=false;
const sigKey=()=>S.y+'-'+S.m;
function drawSig(){
 ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.restore();
 const v=S.sigs[sigKey()];
 if(v){const r=cv.getBoundingClientRect(),im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=v}}
function fit(){const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
 cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.scale(dpr,dpr);ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#111';drawSig()}
const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
cv.addEventListener('pointerdown',e=>{drawing=true;cv.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pt(e))});
cv.addEventListener('pointermove',e=>{if(!drawing)return;ctx.lineTo(...pt(e));ctx.stroke()});
const stop=()=>{if(!drawing)return;drawing=false;try{S.sigs[sigKey()]=cv.toDataURL();save()}catch(e){}};
cv.addEventListener('pointerup',stop);cv.addEventListener('pointercancel',stop);
$('#clr').onclick=()=>{delete S.sigs[sigKey()];drawSig();save()};

// Remise à zéro du mois affiché
$('#reset').onclick=()=>{
 if(!confirm('Remettre '+MOIS[S.m]+' '+S.y+' aux valeurs par défaut (8 h du lundi au vendredi) ? Vos modifications de ce mois seront effacées.'))return;
 build().weeks.forEach(mon=>{for(let i=0;i<6;i++)delete S.over[iso(new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i))]});
 delete S.extra[S.y+'-'+S.m];pk=null;save();render()};

// Sauvegarde / restauration par fichier
$('#exp').onclick=()=>{
 const {y,m,...d}=S;
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'feuille-heures',v:2,data:d})],{type:'application/json'}));
 a.download='feuille-heures-sauvegarde.json';document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),1500)};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{try{
  const j=JSON.parse(r.result),d=j.data;
  if(j.app!=='feuille-heures'||!d||typeof d.over!=='object')throw 0;
  if(!confirm('Remplacer les données actuelles par celles de la sauvegarde ?'))return;
  S={...S,...d,y:S.y,m:S.m};if(!S.sigs)S.sigs={};lastSK=null;save();render();
 }catch(x){alert('Fichier de sauvegarde non valide.')}};
 r.readAsText(f);e.target.value=''};

render();fit();
</script>
</body>
</html>
